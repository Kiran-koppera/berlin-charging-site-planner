[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berlin-charging-site-planner"
version = "1.0.0"
description = "Where should the next EV chargers in Berlin go? Location analysis, competition, demand forecast and business case from public data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "shapely>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "formulas>=1.2", "oletools>=0.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chargeplan = ["vba/*.bas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 135
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "UP007", "UP045"]
